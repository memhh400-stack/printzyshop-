<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Printzy — Custom Printing</title>

<meta name="description"
      content="Printzy — custom stickers, posters, cards and labels.">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f6fa;
    color: #111;
}

/* HEADER */

header {
    background: white;
    border-bottom: 1px solid #ddd;
    position: sticky;
    top: 0;
    z-index: 100;
}

.header-inner {
    max-width: 1200px;
    margin: auto;
    min-height: 70px;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 10px 18px;
}

.logo {
    font-size: 30px;
    font-weight: 800;
    color: #111;
    white-space: nowrap;
}

.logo span {
    color: #7557ff;
}

.search {
    flex: 1;
    display: flex;
}

.search input {
    width: 100%;
    padding: 13px 16px;
    border: 2px solid #7557ff;
    border-radius: 8px 0 0 8px;
    font-size: 16px;
    outline: none;
}

.search button {
    border: 0;
    background: #7557ff;
    color: white;
    padding: 0 20px;
    border-radius: 0 8px 8px 0;
    cursor: pointer;
    font-size: 18px;
}

.cart-button {
    background: #7557ff;
    color: white;
    border: 0;
    padding: 13px 18px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
}

.cart-button:hover,
.search button:hover,
.add-button:hover {
    background: #6043e8;
}

/* HERO */

.hero {
    max-width: 1200px;
    margin: 25px auto;
    padding: 50px 25px;
    border-radius: 18px;
    background: linear-gradient(135deg, #7557ff, #9b7cff);
    color: white;
    text-align: center;
}

.hero h1 {
    font-size: clamp(32px, 6vw, 55px);
    margin-bottom: 12px;
}

.hero p {
    font-size: 18px;
    margin-bottom: 22px;
}

.hero button {
    background: white;
    color: #6043e8;
    border: 0;
    padding: 13px 25px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    font-size: 16px;
}

/* CATEGORIES */

.categories {
    max-width: 1200px;
    margin: 20px auto;
    padding: 0 18px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
}

.category {
    border: 1px solid #ddd;
    background: white;
    padding: 10px 17px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
}

.category.active,
.category:hover {
    background: #7557ff;
    color: white;
    border-color: #7557ff;
}

/* SHOP */

.shop {
    max-width: 1200px;
    margin: auto;
    padding: 10px 18px 50px;
}

.shop-title {
    margin-bottom: 18px;
    font-size: 26px;
}

.products {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
}

.product {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #e1e1e1;
    transition: 0.2s;
}

.product:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}

.product-image {
    width: 100%;
    height: 210px;
    object-fit: cover;
    background: #eee;
}

.product-info {
    padding: 14px;
}

.product-category {
    color: #666;
    font-size: 13px;
    margin-bottom: 5px;
}

.product-name {
    font-size: 18px;
    margin-bottom: 7px;
}

.rating {
    color: #f5a400;
    margin-bottom: 8px;
}

.description {
    color: #555;
    font-size: 14px;
    min-height: 40px;
    margin-bottom: 10px;
}

.price {
    color: #7557ff;
    font-weight: bold;
    font-size: 22px;
    margin-bottom: 10px;
}

.stock {
    font-size: 13px;
    color: #16833b;
    margin-bottom: 10px;
}

.out {
    color: #d22;
}

.add-button {
    width: 100%;
    border: 0;
    background: #7557ff;
    color: white;
    padding: 12px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

/* MODAL */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 500;
    align-items: center;
    justify-content: center;
    padding: 15px;
}

.modal.show {
    display: flex;
}

.modal-box {
    background: white;
    width: 100%;
    max-width: 650px;
    max-height: 92vh;
    overflow-y: auto;
    border-radius: 14px;
    padding: 20px;
    position: relative;
}

.close {
    position: absolute;
    right: 15px;
    top: 12px;
    border: 0;
    background: #eee;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 20px;
}

.modal-image {
    width: 100%;
    max-height: 330px;
    object-fit: cover;
    border-radius: 10px;
    margin-bottom: 15px;
}

.modal h2 {
    margin-bottom: 10px;
}

.modal p {
    color: #555;
    line-height: 1.5;
    margin-bottom: 15px;
}

/* CART */

.cart-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid #ddd;
}

.cart-item img {
    width: 70px;
    height: 70px;
    object-fit: cover;
    border-radius: 8px;
}

.cart-info {
    flex: 1;
}

.cart-info h3 {
    font-size: 16px;
    margin-bottom: 5px;
}

.cart-price {
    color: #7557ff;
    font-weight: bold;
}

.quantity {
    display: flex;
    align-items: center;
    gap: 7px;
}

.quantity button {
    width: 32px;
    height: 32px;
    border: 0;
    border-radius: 6px;
    cursor: pointer;
    background: #eee;
    font-size: 18px;
}

.remove {
    border: 0;
    background: #ffe5e5;
    color: #c00;
    padding: 8px;
    border-radius: 6px;
    cursor: pointer;
}

.total {
    display: flex;
    justify-content: space-between;
    font-size: 23px;
    font-weight: bold;
    margin: 20px 0;
}

.checkout-button {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 8px;
    background: #7557ff;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

/* FORM */

.form-group {
    margin-bottom: 13px;
}

.form-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 5px;
}

.form-group input,
.form-group textarea,
.form-group select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
}

.form-group textarea {
    min-height: 90px;
}

/* EMPTY */

.empty {
    text-align: center;
    padding: 40px 10px;
    color: #666;
}

/* FOOTER */

footer {
    background: #171717;
    color: white;
    text-align: center;
    padding: 35px 15px;
}

footer p {
    color: #bbb;
    margin-top: 7px;
}

/* RESPONSIVE */

@media (max-width: 900px) {
    .products {
        grid-template-columns: repeat(3, 1fr);
    }
}

@media (max-width: 700px) {
    .header-inner {
        flex-wrap: wrap;
    }

    .logo {
        font-size: 25px;
    }

    .search {
        order: 3;
        flex-basis: 100%;
    }

    .products {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 450px) {
    .products {
        grid-template-columns: 1fr;
    }

    .hero {
        margin: 12px;
        padding: 35px 15px;
    }

    .cart-button {
        padding: 10px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">

        <div class="logo">
            Print<span>zy</span> 🖨️
        </div>

        <div class="search">
            <input
                id="searchInput"
                type="text"
                placeholder="Search Printzy..."
                oninput="renderProducts()"
            >

            <button onclick="renderProducts()">🔎</button>
        </div>

        <button class="cart-button" onclick="openCart()">
            🛒 Cart (<span id="cartCount">0</span>)
        </button>

    </div>
</header>


<section class="hero">

    <h1>Make It. Print It. Love It.</h1>

    <p>
        Custom stickers, posters, cards and labels made for you.
    </p>

    <button onclick="scrollToShop()">
        Shop Now →
    </button>

</section>


<div class="categories" id="categories"></div>


<section class="shop" id="shop">

    <h2 class="shop-title">
        Popular Products
    </h2>

    <div class="products" id="products"></div>

</section>


<footer>

    <h2>Printzy 🖨️</h2>

    <p>
        Custom printing made simple.
    </p>

    <p>
        © 2026 Printzy
    </p>

</footer>


<!-- PRODUCT DETAILS -->

<div class="modal" id="productModal">

    <div class="modal-box">

        <button
            class="close"
            onclick="closeModal('productModal')"
        >
            ✕
        </button>

        <div id="productDetails"></div>

    </div>

</div>


<!-- CART -->

<div class="modal" id="cartModal">

    <div class="modal-box">

        <button
            class="close"
            onclick="closeModal('cartModal')"
        >
            ✕
        </button>

        <h2>🛒 Your Cart</h2>

        <div id="cartItems"></div>

        <div class="total">
            <span>Total</span>
            <span id="cartTotal">£0.00</span>
        </div>

        <button
            class="checkout-button"
            onclick="openCheckout()"
        >
            Continue to Checkout →
        </button>

    </div>

</div>


<!-- CHECKOUT -->

<div class="modal" id="checkoutModal">

    <div class="modal-box">

        <button
            class="close"
            onclick="closeModal('checkoutModal')"
        >
            ✕
        </button>

        <h2>📦 Place Your Order</h2>

        <br>

        <form onsubmit="submitOrder(event)">

            <div class="form-group">

                <label>Your name</label>

                <input
                    id="customerName"
                    required
                    placeholder="Enter your name"
                >

            </div>


            <div class="form-group">

                <label>Order type</label>

                <select id="orderType">

                    <option>
                        Collection
                    </option>

                    <option>
                        Delivery
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Delivery / collection details
                </label>

                <textarea
                    id="customerDetails"
                    required
                    placeholder="Enter your details"
                ></textarea>

            </div>


            <div class="form-group">

                <label>
                    What should we print?
                </label>

                <textarea
                    id="customerNotes"
                    placeholder="Tell us about your design"
                ></textarea>

            </div>


            <p>
                <strong>Total:</strong>
                <span id="checkoutTotal">£0.00</span>
            </p>

            <br>

            <button
                class="checkout-button"
                type="submit"
            >
                Submit Order
            </button>

        </form>

    </div>

</div>


<script>

/* =========================================================
   PRODUCTS

   Replace the image URLs with photos of your REAL products
   when you have them.
   ========================================================= */

const products = [

    {
        id: 1,
        name: "Custom Sticker Sheet",
        price: 3.00,
        category: "Stickers",
        rating: "★★★★★",
        stock: 50,
        image:
        "https://images.unsplash.com/photo-1600431521340-491eca880813?auto=format&fit=crop&w=800&q=80",
        description:
        "Personalised sticker sheets made with your own designs."
    },

    {
        id: 2,
        name: "Custom Poster",
        price: 5.00,
        category: "Posters",
        rating: "★★★★★",
        stock: 25,
        image:
        "https://images.unsplash.com/photo-1561214115-f2f134cc4912?auto=format&fit=crop&w=800&q=80",
        description:
        "Custom posters for bedrooms, gaming setups and walls."
    },

    {
        id: 3,
        name: "Party Invitations",
        price: 4.00,
        category: "Cards",
        rating: "★★★★☆",
        stock: 100,
        image:
        "https://images.unsplash.com/photo-1511795409834-ef04bbd61622?auto=format&fit=crop&w=800&q=80",
        description:
        "Personalised invitations for birthdays and special events."
    },

    {
        id: 4,
        name: "Custom Labels",
        price: 3.00,
        category: "Labels",
        rating: "★★★★★",
        stock: 75,
        image:
        "https://images.unsplash.com/photo-1586953208448-b95a79798f07?auto=format&fit=crop&w=800&q=80",
        description:
        "Custom labels for boxes, jars, notebooks and businesses."
    },

    {
        id: 5,
        name: "Birthday Card",
        price: 3.50,
        category: "Cards",
        rating: "★★★★☆",
        stock: 60,
        image:
        "https://images.unsplash.com/photo-1513151233558-d860c5398176?auto=format&fit=crop&w=800&q=80",
        description:
        "A personalised birthday card with your own message."
    },

    {
        id: 6,
        name: "Gaming Poster",
        price: 6.00,
        category: "Posters",
        rating: "★★★★★",
        stock: 30,
        image:
        "https://images.unsplash.com/photo-1547394765-185e1e68f34e?auto=format&fit=crop&w=800&q=80",
        description:
        "A custom gaming poster for your room or gaming setup."
    }

];


/* =========================================================
   CART
   ========================================================= */

let cart = {};

let currentCategory = "All";


/* =========================================================
   INITIALISE
   ========================================================= */

renderCategories();

renderProducts();

updateCart();


/* =========================================================
   CATEGORIES
   ========================================================= */

function renderCategories() {

    const categories =
        ["All", ...new Set(
            products.map(product => product.category)
        )];

    const container =
        document.getElementById("categories");

    container.innerHTML = "";

    categories.forEach(category => {

        const button =
            document.createElement("button");

        button.className =
            "category " +
            (category === currentCategory
                ? "active"
                : "");

        button.textContent = category;

        button.onclick = () => {

            currentCategory = category;

            renderCategories();

            renderProducts();

        };

        container.appendChild(button);

    });

}


/* =========================================================
   PRODUCTS
   ========================================================= */

function renderProducts() {

    const container =
        document.getElementById("products");

    const search =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();


    const filtered =
        products.filter(product => {

            const matchesSearch =
                product.name
                .toLowerCase()
                .includes(search) ||
                product.category
                .toLowerCase()
                .includes(search);

            const matchesCategory =
                currentCategory === "All" ||
                product.category === currentCategory;

            return matchesSearch &&
                   matchesCategory;

        });


    container.innerHTML = "";


    if (filtered.length === 0) {

        container.innerHTML =
            `<div class="empty">
                <h2>No products found</h2>
                <p>Try another search.</p>
            </div>`;

        return;

    }


    filtered.forEach(product => {

        const card =
            document.createElement("div");

        card.className = "product";


        const stockText =
            product.stock > 0
                ? `${product.stock} available`
                : "Out of stock";


        card.innerHTML = `

            <img
                class="product-image"
                src="${product.image}"
                alt="${product.name}"
                onerror="this.src='https://placehold.co/800x600?text=Printzy'"
            >

            <div class="product-info">

                <div class="product-category">
                    ${product.category}
                </div>

                <h3 class="product-name">
                    ${product.name}
                </h3>

                <div class="rating">
                    ${product.rating}
                </div>

                <div class="description">
                    ${product.description}
                </div>

                <div class="price">
                    £${product.price.toFixed(2)}
                </div>

                <div class="stock
                    ${product.stock <= 0 ? "out" : ""}">
                    ${stockText}
                </div>

                <button
                    class="add-button"
                    onclick="addToCart(${product.id})"
                    ${product.stock <= 0 ? "disabled" : ""}
                >
                    🛒 Add to Cart
                </button>

                <br><br>

                <button
                    class="add-button"
                    style="background:#eee;color:#111;"
                    onclick="showProduct(${product.id})"
                >
                    View Details
                </button>

            </div>
        `;


        container.appendChild(card);

    });

}


/* =========================================================
   PRODUCT DETAILS
   ========================================================= */

function showProduct(id) {

    const product =
        products.find(p => p.id === id);

    if (!product) return;


    document.getElementById("productDetails")
        .innerHTML = `

        <img
            class="modal-image"
            src="${product.image}"
            alt="${product.name}"
            onerror="this.src='https://placehold.co/800x600?text=Printzy'"
        >

        <h2>${product.name}</h2>

        <div class="rating">
            ${product.rating}
        </div>

        <div class="price">
            £${product.price.toFixed(2)}
        </div>

        <p>
            ${product.description}
        </p>

        <p>
            <strong>Category:</strong>
            ${product.category}
        </p>

        <p>
            <strong>Stock:</strong>
            ${product.stock}
        </p>

        <button
            class="checkout-button"
            onclick="addToCart(${product.id}); closeModal('productModal')"
        >
            🛒 Add to Cart
        </button>
    `;


    document
        .getElementById("productModal")
        .classList.add("show");

}


/* =========================================================
   ADD TO CART
   ========================================================= */

function addToCart(id) {

    const product =
        products.find(p => p.id === id);

    if (!product) return;


    if (product.stock <= 0) {

        alert("Sorry, this product is out of stock.");

        return;

    }


    if (!cart[id]) {

        cart[id] = 1;

    } else {

        if (cart[id] >= product.stock) {

            alert("You have reached the available stock.");

            return;

        }

        cart[id]++;

    }


    updateCart();

}


/* =========================================================
   CART
   ========================================================= */

function openCart() {

    renderCart();

    document
        .getElementById("cartModal")
        .classList.add("show");

}


function renderCart() {

    const container =
        document.getElementById("cartItems");

    container.innerHTML = "";


    const ids =
        Object.keys(cart)
        .filter(id => cart[id] > 0);


    if (ids.length === 0) {

        container.innerHTML =
            `<div class="empty">
                <h3>Your cart is empty 🛒</h3>
                <p>Add a product to get started.</p>
            </div>`;

        document
            .getElementById("cartTotal")
            .textContent = "£0.00";

        return;

    }


    let total = 0;


    ids.forEach(id => {

        const product =
            products.find(
                p => p.id === Number(id)
            );

        if (!product) return;


        const quantity = cart[id];

        const subtotal =
            product.price * quantity;

        total += subtotal;


        const item =
            document.createElement("div");

        item.className = "cart-item";


        item.innerHTML = `

            <img
                src="${product.image}"
                alt="${product.name}"
                onerror="this.src='https://placehold.co/100x100?text=Printzy'"
            >

            <div class="cart-info">

                <h3>
                    ${product.name}
                </h3>

                <div class="cart-price">
                    £${product.price.toFixed(2)}
                </div>

            </div>

            <div class="quantity">

                <button
                    onclick="changeQuantity(${product.id}, -1)"
                >
                    −
                </button>

                <strong>
                    ${quantity}
                </strong>

                <button
                    onclick="changeQuantity(${product.id}, 1)"
                >
                    +
                </button>

            </div>

            <button
                class="remove"
                onclick="removeFromCart(${product.id})"
            >
                🗑
            </button>
        `;


        container.appendChild(item);

    });


    document
        .getElementById("cartTotal")
        .textContent =
        `£${total.toFixed(2)}`;

}


/* =========================================================
   QUANTITY
   ========================================================= */

function changeQuantity(id, amount) {

    const product =
        products.find(p => p.id === id);

    if (!product) return;


    const newQuantity =
        (cart[id] || 0) + amount;


    if (newQuantity <= 0) {

        delete cart[id];

    } else if (newQuantity <= product.stock) {

        cart[id] = newQuantity;

    } else {

        alert("You cannot add more than the available stock.");

        return;

    }


    updateCart();

    renderCart();

}


function removeFromCart(id) {

    delete cart[id];

    updateCart();

    renderCart();

}


/* =========================================================
   CART COUNT
   ========================================================= */

function updateCart() {

    const count =
        Object.values(cart)
        .reduce(
            (sum, quantity) =>
            sum + quantity,
            0
        );


    document
        .getElementById("cartCount")
        .textContent = count;

}


/* =========================================================
   CHECKOUT
   ========================================================= */

function openCheckout() {

    if (
        Object.keys(cart).length === 0
    ) {

        alert("Your cart is empty.");

        return;

    }


    const total =
        calculateTotal();


    document
        .getElementById("checkoutTotal")
        .textContent =
        `£${total.toFixed(2)}`;


    closeModal("cartModal");

    document
        .getElementById("checkoutModal")
        .classList.add("show");

}


function calculateTotal() {

    let total = 0;


    Object.keys(cart).forEach(id => {

        const product =
            products.find(
                p => p.id === Number(id)
            );

        if (product) {

            total +=
                product.price *
                cart[id];

        }

    });


    return total;

}


/* =========================================================
   SUBMIT ORDER
   ========================================================= */

function submitOrder(event) {

    event.preventDefault();


    const name =
        document
        .getElementById("customerName")
        .value.trim();

    const type =
        document
        .getElementById("orderType")
        .value;

    const details =
        document
        .getElementById("customerDetails")
        .value.trim();

    const notes =
        document
        .getElementById("customerNotes")
        .value.trim();


    const total =
        calculateTotal();


    let orderText =
        `PRINTZY ORDER\n\n`;

    orderText +=
        `Customer: ${name}\n`;

    orderText +=
        `Type: ${type}\n`;

    orderText +=
        `Details: ${details}\n`;

    orderText +=
        `Notes: ${notes}\n\n`;

    orderText +=
        `Items:\n`;


    Object.keys(cart).forEach(id => {

        const product =
            products.find(
                p => p.id === Number(id)
            );

        if (product) {

            orderText +=
                `${product.name} x ${cart[id]} — ` +
                `£${(
                    product.price *
                    cart[id]
                ).toFixed(2)}\n`;

        }

    });


    orderText +=
        `\nTOTAL: £${total.toFixed(2)}`;


    /*
       For now the order is copied to the clipboard.

       This lets you test the website without needing
       a server or payment system.
    */

    navigator.clipboard
        .writeText(orderText)
        .then(() => {

            alert(
                "Order created! " +
                "The order details have been copied. " +
                "You can paste them into your order system."
            );

        })
        .catch(() => {

            alert(
                "Order created!\n\n" +
                orderText
            );

        });


    cart = {};

    updateCart();

    closeModal("checkoutModal");

    document
        .getElementById("customerName")
        .value = "";

    document
        .getElementById("customerDetails")
        .value = "";

    document
        .getElementById("customerNotes")
        .value = "";

}


/* =========================================================
   MODALS
   ========================================================= */

function closeModal(id) {

    document
        .getElementById(id)
        .classList.remove("show");

}


window.onclick = function(event) {

    if (
        event.target.classList.contains("modal")
    ) {

        event.target.classList.remove("show");

    }

};


/* =========================================================
   SCROLL
   ========================================================= */

function scrollToShop() {

    document
        .getElementById("shop")
        .scrollIntoView({
            behavior: "smooth"
        });

}

</script>
